<section class="employee-section">

  <h2>Employee List</h2>

  <input
    type="text"
    [(ngModel)]="searchText"
    placeholder="Search employee..."
  >

  <!-- No employees exist -->
  <div *ngIf="employees.length === 0">

    <p class="empty">
      No employees found.
    </p>

  </div>

  <!-- Employees exist -->
  <div
    class="employee-container"
    *ngIf="employees.length > 0">

    <!-- Employee cards -->
    <div
      class="employee-card"
      appHighlight
      *ngFor="let employee of employees | filter: searchText; trackBy: trackById">

      <div class="employee-info">

        <h3>
          {{ employee.name | capitalize }}
        </h3>

        <p>
          <strong>Email:</strong>
          {{ employee.email }}
        </p>

        <p>
          <strong>Age:</strong>
          {{ employee.age }}
        </p>

        <p>
          <strong>Department:</strong>
          {{ employee.department }}
        </p>

        <p *ngIf="employee.status">
          <strong>Status:</strong>
          Active
        </p>

        <p *ngIf="!employee.status">
          <strong>Status:</strong>
          Inactive
        </p>

      </div>

      <button
        class="delete-button"
        (click)="deleteEmployee(employee.id)">

        Delete

      </button>

    </div>

  </div>

  <!-- Search returned no employees -->
  <p
    *ngIf="employees.length > 0 && (employees | filter: searchText).length === 0"
    class="empty">

    No employees match your search.

  </p>

</section>
